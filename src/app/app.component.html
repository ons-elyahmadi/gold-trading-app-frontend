<!-- =====================================================
     APP SHELL — Gold Trading Alert Dashboard
     ===================================================== -->
<div class="app-shell">

  <!-- ── Top Navigation Bar ── -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">Gold<span class="brand-accent">Sens</span></span>
      <span class="brand-tagline">Gold Intelligence Platform</span>
    </div>

    <nav class="topbar__nav">
      <button class="nav-btn" [class.active]="activeTab === 'dashboard'" (click)="setTab('dashboard')">
        <span class="nav-icon">⬡</span> Dashboard
      </button>
      <button class="nav-btn" [class.active]="activeTab === 'alerts'" (click)="setTab('alerts')">
        <span class="nav-icon">◉</span> Alertes
        <span class="nav-badge" *ngIf="(trading.stats$ | async)?.critique as c">{{ c }}</span>
      </button>
      <button class="nav-btn" [class.active]="activeTab === 'chat'" (click)="setTab('chat')">
        <span class="nav-icon">◈</span> Analyste IA
      </button>
    </nav>

    <div class="topbar__meta">
      <div class="meta-clock">{{ currentTime | date:'HH:mm:ss' }}</div>
      <div class="meta-date">{{ currentTime | date:'dd MMM yyyy' }}</div>
      <div class="meta-status">
        <span class="status-dot"></span>LIVE
      </div>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main class="main-content">
    <app-dashboard *ngIf="activeTab === 'dashboard'"></app-dashboard>
    <app-alerts    *ngIf="activeTab === 'alerts'"></app-alerts>
    <app-chat      *ngIf="activeTab === 'chat'"></app-chat>
  </main>

  <!-- ── Footer ── -->
  <footer class="app-footer">
    <span>© 2025 GoldSense · Données fournies par NewsAPI &amp; Groq AI</span>
    <span class="footer-sep">|</span>
    <span>Usage à des fins éducatives uniquement — Pas de conseil financier</span>
  </footer>

</div>
